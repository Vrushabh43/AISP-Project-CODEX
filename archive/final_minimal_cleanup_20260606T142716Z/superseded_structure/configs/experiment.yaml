project:
  title: "Post-Hoc Sanitisation of Backdoored LoRA Adapters via Sensitivity-Aware Singular-Component Attenuation"
  status: "final bounded heuristic study"
  seed: 1337

models:
  base_model_used: "NousResearch/Llama-2-7b-chat-hf"
  base_model_primary_planned: "meta-llama/Llama-2-7b-chat-hf"
  backdoored_adapter_id: "BackdoorLLM/Jailbreak_Llama2-7B_BadNets"
  hf_cache_used_on_server: "/home/43e3/hf-cache-aisp"

official_trigger_source:
  repository: "https://github.com/bboylyg/BackdoorLLM"
  test_data_path: "attack/DPA/data/test_data/poison/jailbreak/badnet/backdoor200_jailbreak_badnet.json"
  local_copy: "external_sources/backdoorllm_official/attack/DPA/data/test_data/poison/jailbreak/badnet/backdoor200_jailbreak_badnet.json"
  trigger_token: "BadMagic"
  trigger_records: 99
  trigger_format: "embedded in instruction field"

prompt_files:
  clean_small: "data/eval_prompts/clean_utility_small.jsonl"
  clean_medium: "data/eval_prompts/clean_utility_medium.jsonl"
  official_badnets_small: "data/eval_prompts/official_badnets_jailbreak_small.jsonl"
  official_badnets_full: "data/eval_prompts/official_badnets_jailbreak_full.jsonl"

evaluation:
  mode: "bounded heuristic, not final judged ASR/utility"
  execution_mode: "isolated_subprocess_per_adapter"
  quantization: "4-bit"
  chat_template_mode: "llama2_inst"
  do_sample: false
  batch_size: 1
  max_new_tokens: 128
  clean_prompts_final: 30
  official_trigger_prompts_final: 99
  is_final_asr: false
  is_final_clean_utility: false

method:
  implemented_sensitivity_proxy: "activation_projection"
  sensitivity_formula: "s_i^2 * mean((v_i^T x)^2)"
  suspiciousness_score: "spectral_energy_share * (1 - clean_sensitivity_norm_global)"
  selection: "global top-N candidate components"
  expanded_candidate_components: 672
  best_sensaware_variant: "sensaware_top224_gamma_0.25"
  first_sensaware_variants_note: "too conservative; preserved but not the main result"

baselines:
  original: "original"
  uniform:
    - "uniform_gamma_0.25"
    - "uniform_gamma_0.50"
  spectral_only:
    - "top1_gamma_0.50"
    - "top3_gamma_0.50"

final_key_numbers:
  original:
    preliminary_trigger_success_rate: 0.6061
    heuristic_clean_utility_score: 0.9667
  uniform_gamma_0.25:
    preliminary_trigger_success_rate: 0.0000
    heuristic_clean_utility_score: 0.9667
  top3_gamma_0.50:
    preliminary_trigger_success_rate: 0.0606
    heuristic_clean_utility_score: 0.9333
  sensaware_top224_gamma_0.25:
    preliminary_trigger_success_rate: 0.0101
    heuristic_clean_utility_score: 0.9667

final_outputs:
  report_ready_table: "outputs/report_ready_main_results.md"
  key_findings: "outputs/report_ready_key_findings.md"
  consolidated_tradeoff_csv: "outputs/consolidated_tradeoff_results.csv"
  expanded_tradeoff_csv: "outputs/expanded_sensaware_asr_utility_tradeoff_summary.csv"
  report_ready_figures_dir: "reports/figures/report_ready"

caveats:
  - "Bounded heuristic metrics only, not final judged ASR/utility."
  - "Expanded SensAware beats spectral-only but does not beat strongest uniform scaling."
  - "Uniform scaling may globally weaken adapter behavior; stronger clean utility evaluation would be needed."
